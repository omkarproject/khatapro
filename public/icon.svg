<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="skp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="skp-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="skp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#skp-grad)" filter="url(#skp-shadow)" />

  <!-- Inner Subtle Ring -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Centered Four-Point Sparkle Star -->
  <path d="M 64 26 C 64 45 45 64 26 64 C 45 64 64 83 64 102 C 64 83 83 64 102 64 C 83 64 64 45 64 26 Z" fill="url(#skp-sparkle)" />
  
  <!-- Mini Accent Sparkle -->
  <path d="M 94 30 C 94 36 88 42 82 42 C 88 42 94 48 94 54 C 94 48 100 42 106 42 C 100 42 94 36 94 30 Z" fill="#FDE047" opacity="0.9" />
</svg>
